<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhe seu pedido</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6ECDC">
<!-- Página do pedido que o cliente vê. O GitHub Pages serve este arquivo para /p/CODIGO (endereço que não existe como arquivo).
     A tela em si fica em assets/pedido.js e assets/pedido.css, que a página inicial também usa na demonstração. -->
<script>(function () { var m = location.pathname.match(/^(.*?\/)p\/[^\/]+\/?$/); if (m) document.write('<base href="' + m[1].replace(/"/g, '') + '">'); })();</script>
<link rel="icon" type="image/svg+xml" href="assets/icone.svg">
<link rel="stylesheet" href="assets/estilo.css?v=8">
<link rel="stylesheet" href="assets/pedido.css?v=8">
<style>
  .pagina { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .carregando { text-align: center; padding: 60px 0; color: var(--suave); }
  .inicio-link { display: inline-block; margin-top: 14px; color: var(--cor); font-weight: 700; }
</style>
</head>
<body>
<main class="pagina acomp" id="app" aria-live="polite">
  <p class="carregando">Carregando seu pedido…</p>
</main>
<noscript><p style="text-align:center;padding:20px">Ative o JavaScript para acompanhar o pedido.</p></noscript>

<script src="config.js?v=8"></script>
<script src="assets/comum.js?v=8"></script>
<script src="assets/pedido.js?v=8"></script>
<script>
(() => {
  'use strict';
  const { el } = CT;
  const app = document.getElementById('app');
  const curto = location.pathname.match(/\/p\/([^/]+)\/?$/);
  const codigo = decodeURIComponent((curto && curto[1]) || new URLSearchParams(location.search).get('p') || '').trim();
  let ultimo = null, diferencaRelogio = 0;
  let estudio = null, logoGuardada = { md5: null, logo: '' };

  function semPedido(titulo, texto, comInicio) {
    document.title = estudio ? `${titulo} | ${estudio.nome}` : titulo;
    app.classList.remove('concluido');
    app.replaceChildren(
      el('header', { class: 'topo' }, estudio ? CT.logoEstudio(estudio, 104) : null, el('small', { text: 'Acompanhamento do pedido' })),
      el('div', { class: 'cartao vazio' }, el('h1', { text: titulo }), el('p', { text: texto }),
        comInicio ? el('a', { class: 'inicio-link', href: './', text: 'Ir para a página inicial' }) : null));
  }

  function desenhar(p) {
    ultimo = p;
    if (!estudio || JSON.stringify(estudio) !== JSON.stringify(p.estudio)) {
      estudio = p.estudio || { nome: '' };
      CT.aplicarCor(estudio.cor); CT.iconeAba(estudio);
    }
    document.title = `${p.titulo} | ${estudio.nome}`;
    CT.telaPedido(app, p, { agora: Date.now() + diferencaRelogio });
  }

  async function carregar(primeira) {
    if (!CT.configurado) return semPedido('Página em configuração', 'Estamos configurando o acompanhamento.');
    if (codigo.length < 12) return semPedido(codigo ? 'Link incompleto' : 'Página não encontrada',
      codigo ? 'Confira se você abriu o link inteiro que enviamos.' : 'Este endereço não existe. Se você recebeu um link de pedido, abra o link inteiro.', true);
    try {
      const corpo = { p_codigo: codigo };
      if (logoGuardada.md5) corpo.p_logo_tenho = logoGuardada.md5;
      const p = await CT.pedir('/rest/v1/rpc/ct_pedido_publico', { metodo: 'POST', corpo });
      if (p && p.estudio) {
        // A logo só vem do servidor na primeira vez (ou quando o estúdio troca de logo).
        if (p.estudio.logo == null && p.estudio.logo_md5 === logoGuardada.md5) p.estudio.logo = logoGuardada.logo;
        else logoGuardada = { md5: p.estudio.logo_md5 || null, logo: p.estudio.logo || '' };
      }
      if (!p) return semPedido('Pedido não encontrado', 'Este link não corresponde a nenhum pedido. Peça o link de novo para a gente.');
      diferencaRelogio = CT.data(p.agora).getTime() - Date.now();
      desenhar(p);
    } catch (e) {
      if (primeira || !ultimo) semPedido('Não deu para carregar agora', e.status === 0 ? 'Sem conexão. Verifique a internet e tente de novo.' : 'Tente de novo em instantes.');
    }
  }
  carregar(true);
  // O mesmo link mostra sempre a situação atual: atualiza sozinho a cada 30 s e ao voltar para a página.
  setInterval(() => { if (document.visibilityState === 'visible') carregar(false); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregar(false); });
})();
</script>
</body>
</html>
