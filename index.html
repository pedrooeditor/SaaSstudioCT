<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhe seu pedido</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2FB">
<link rel="stylesheet" href="assets/estilo.css?v=1">
<style>
  .pagina { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
  .topo { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
  .logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--cor); color: #fff; font-weight: 800; font-size: 18px; }
  .topo b { display: block; font-size: 17px; }
  .topo small { color: var(--suave); }
  .titulo { margin: 6px 0 2px; font-size: 22px; line-height: 1.2; }
  .ola { margin: 0; color: var(--suave); }
  .tipo { display: inline-block; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--cor) 12%, #fff); color: var(--cor); font-size: 12.5px; font-weight: 700; }
  .progresso { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-top: 16px; }
  .anel { position: relative; width: 116px; height: 116px; }
  .anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anel circle { fill: none; stroke-width: 12; }
  .anel .fundo { stroke: #ECE9F5; }
  .anel .valor { stroke: var(--cor); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .anel b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; }
  .numeros { display: grid; gap: 8px; }
  .num { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--linha); }
  .num:last-child { border: 0; padding: 0; }
  .num span { color: var(--suave); font-size: 14px; }
  .num b { font-size: 20px; }
  .etapas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 0; padding: 0; list-style: none; }
  .etapas li { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 11.5px; font-weight: 650; color: var(--suave); position: relative; }
  .etapas li::before { content: ""; position: absolute; top: 11px; left: -50%; right: 50%; height: 3px; background: var(--linha); z-index: 0; }
  .etapas li:first-child::before { display: none; }
  .etapas li.feita::before, .etapas li.atual::before { background: var(--cor); }
  .etapas .bola { position: relative; z-index: 1; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--linha); color: #fff; font-size: 12px; }
  .etapas li.feita .bola { background: var(--cor); border-color: var(--cor); }
  .etapas li.atual .bola { border-color: var(--cor); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cor) 20%, transparent); }
  .etapas li.atual { color: var(--texto); }
  .faixa { padding: 12px 14px; border-radius: 12px; font-weight: 650; }
  .faixa.alerta { background: var(--alerta-bg); color: var(--alerta); }
  .faixa.ok { background: var(--ok-bg); color: var(--ok); }
  .faixa.perigo { background: var(--perigo-bg); color: var(--perigo); }
  .prazo h2, .historico h2, .recado h2 { margin: 0 0 10px; font-size: 15px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .previsao { font-size: 19px; font-weight: 750; }
  .contagem { margin-top: 2px; font-weight: 650; }
  .contagem.atraso { color: var(--alerta); }
  .linhas { display: grid; gap: 6px; margin-top: 12px; color: var(--suave); font-size: 14px; }
  .linhas b { color: var(--texto); }
  .recado p { margin: 0; white-space: pre-wrap; font-size: 15.5px; }
  .linha-tempo { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .linha-tempo li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; }
  .linha-tempo li::before { content: ""; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--cor); }
  .linha-tempo small { display: block; color: var(--suave); font-size: 12.5px; }
  .rodape { text-align: center; color: var(--suave); font-size: 13px; }
  .btn-whats { width: 100%; min-height: 52px; font-size: 16px; }
  .vazio { text-align: center; padding: 40px 20px; }
  .vazio h1 { font-size: 20px; margin: 0 0 6px; }
  .vazio p { margin: 0; color: var(--suave); }
  .carregando { text-align: center; padding: 60px 0; color: var(--suave); }
  @media (max-width: 380px) { .progresso { grid-template-columns: 1fr; justify-items: center; } .numeros { width: 100%; } }
</style>
</head>
<body>
<main class="pagina" id="app" aria-live="polite">
  <p class="carregando">Carregando seu pedido…</p>
</main>
<noscript><p style="text-align:center;padding:20px">Ative o JavaScript para acompanhar o pedido.</p></noscript>

<script src="config.js?v=1"></script>
<script src="assets/comum.js?v=1"></script>
<script>
(() => {
  'use strict';
  const { el, nf } = CT;
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const codigo = (params.get('p') || location.hash.replace(/^#/, '') || '').trim();
  let ultimo = null, diferencaRelogio = 0;

  function semPedido(titulo, texto) {
    document.title = 'Pedido não encontrado';
    app.replaceChildren(el('div', { class: 'cartao vazio' }, el('h1', { text: titulo }), el('p', { text: texto })));
  }

  function anel(pct) {
    const r = 50, c = 2 * Math.PI * r;
    const svg = new DOMParser().parseFromString(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 116" aria-hidden="true"><circle class="fundo" cx="58" cy="58" r="${r}"/><circle class="valor" cx="58" cy="58" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/></svg>`, 'image/svg+xml').documentElement;
    return el('div', { class: 'anel', role: 'img', 'aria-label': `${pct}% pronto` }, document.importNode(svg, true), el('b', { text: `${pct}%` }));
  }

  function desenhar(p) {
    ultimo = p;
    const agora = Date.now() + diferencaRelogio;
    CT.aplicarCor(p.estudio && p.estudio.cor);
    const estudio = (p.estudio && p.estudio.nome) || 'Studio';
    document.title = `${p.titulo} | ${estudio}`;
    const pct = Math.floor(p.feitos / p.quantidade * 100);
    const faltam = p.quantidade - p.feitos;
    const previsao = CT.data(p.previsao).getTime();
    const fim = ['pronto', 'entregue'].includes(p.etapa);

    // Etapas
    const atual = p.etapa === 'pausado' ? 'producao' : p.etapa;
    const iAtual = CT.ETAPAS.findIndex(e => e.id === atual);
    const etapas = el('ol', { class: 'etapas', 'aria-label': 'Etapas do pedido' },
      CT.ETAPAS.map((e, i) => el('li', { class: i < iAtual || (i === iAtual && atual === 'entregue') ? 'feita' : i === iAtual ? 'atual' : '', 'aria-current': i === iAtual ? 'step' : null },
        el('span', { class: 'bola', text: i < iAtual || atual === 'entregue' && i === iAtual ? '✓' : '' }), e.nome)));

    // Faixa de destaque
    let faixa = null;
    if (p.etapa === 'cancelado') faixa = el('div', { class: 'faixa perigo', text: 'Este pedido foi cancelado. Fale com o estúdio se tiver dúvidas.' });
    else if (p.etapa === 'pausado') faixa = el('div', { class: 'faixa alerta', text: 'Produção pausada no momento. O estúdio vai te atualizar por aqui.' });
    else if (p.etapa === 'pronto') faixa = el('div', { class: 'faixa ok', text: 'Seu pedido está pronto! 🎉' });
    else if (p.etapa === 'entregue') faixa = el('div', { class: 'faixa ok', text: 'Pedido entregue. Obrigado pela confiança!' });

    // Prazo
    const resta = previsao - agora;
    const atrasado = resta < 0 && !fim && p.etapa !== 'cancelado';
    const r = !fim && p.etapa === 'producao' ? CT.ritmo(p, agora) : null;
    const prazo = el('section', { class: 'cartao prazo' },
      el('h2', { text: fim ? 'Prazo' : 'Previsão de entrega' }),
      el('div', { class: 'previsao', text: CT.quando(p.previsao) }),
      fim ? null : el('div', { class: 'contagem' + (atrasado ? ' atraso' : ''), text: atrasado ? `Passou ${CT.duracao(-resta)} do previsto. O estúdio vai te atualizar.` : `Faltam ${CT.duracao(resta)}` }),
      el('div', { class: 'linhas' },
        el('div', {}, 'Tempo de produção: ', el('b', { text: CT.prazoTexto(p.prazo_horas) })),
        el('div', {}, 'Início: ', el('b', { text: CT.quando(p.inicio) })),
        r ? el('div', {}, 'No ritmo atual, ', el('b', { text: `${nf.format(faltam)} restante${faltam === 1 ? '' : 's'} em cerca de ${CT.duracao(r.faltamMs)}` })) : null));

    // Histórico
    const eventos = (p.eventos || []).slice(0, 12);
    const historico = eventos.length ? el('section', { class: 'cartao historico' },
      el('h2', { text: 'Atualizações' }),
      el('ul', { class: 'linha-tempo' }, eventos.map(e => el('li', {}, el('div', {},
        el('span', { text: e.tipo === 'progresso' && e.feitos != null ? `${e.texto} · ${nf.format(e.feitos)} de ${nf.format(p.quantidade)}` : e.texto }),
        el('small', { text: `${CT.diaHora(e.em)} · ${CT.relativo(e.em, agora)}` })))))) : null;

    const recado = p.mensagem && p.mensagem.trim() ? el('section', { class: 'cartao recado' }, el('h2', { text: `Recado de ${estudio}` }), el('p', { text: p.mensagem })) : null;

    const whats = p.estudio && p.estudio.whatsapp
      ? el('a', { class: 'btn btn-cor btn-whats', href: CT.linkWhats(p.estudio.whatsapp, `Olá! Sobre o meu pedido "${p.titulo}": ${location.href}`), target: '_blank', rel: 'noopener noreferrer' }, 'Falar com o estúdio no WhatsApp')
      : null;

    app.replaceChildren(...[
      el('header', { class: 'topo' }, el('div', { class: 'logo', 'aria-hidden': 'true', text: estudio.trim().charAt(0).toUpperCase() }), el('div', {}, el('b', { text: estudio }), el('small', { text: 'Acompanhamento do pedido' }))),
      el('section', { class: 'cartao' },
        p.tipo ? el('span', { class: 'tipo', text: p.tipo }) : null,
        el('h1', { class: 'titulo', text: p.titulo }),
        p.cliente ? el('p', { class: 'ola', text: `Olá, ${p.cliente}! Veja como está o seu pedido.` }) : null,
        el('div', { class: 'progresso' }, anel(pct),
          el('div', { class: 'numeros' },
            el('div', { class: 'num' }, el('span', { text: 'Prontos' }), el('b', { text: nf.format(p.feitos) })),
            el('div', { class: 'num' }, el('span', { text: 'Faltam' }), el('b', { text: nf.format(faltam) })),
            el('div', { class: 'num' }, el('span', { text: 'Total do pedido' }), el('b', { text: nf.format(p.quantidade) }))))),
      faixa,
      el('section', { class: 'cartao' }, etapas),
      prazo, recado, historico, whats,
      el('p', { class: 'rodape', text: `Atualizado ${CT.relativo(p.atualizado_em, agora)} · esta página se atualiza sozinha` })].filter(Boolean));
  }

  async function carregar(primeira) {
    if (!CT.configurado) return semPedido('Página em configuração', 'O estúdio ainda está configurando o acompanhamento.');
    if (codigo.length < 20) return semPedido('Link incompleto', 'Confira se você abriu o link inteiro que o estúdio enviou.');
    try {
      const p = await CT.pedir('/rest/v1/rpc/ct_pedido_publico', { metodo: 'POST', corpo: { p_codigo: codigo } });
      if (!p) return semPedido('Pedido não encontrado', 'Este link não corresponde a nenhum pedido. Peça o link de novo ao estúdio.');
      diferencaRelogio = CT.data(p.agora).getTime() - Date.now();
      desenhar(p);
    } catch (e) {
      if (primeira || !ultimo) semPedido('Não deu para carregar agora', e.status === 0 ? 'Sem conexão. Verifique a internet e tente de novo.' : 'Tente de novo em instantes.');
    }
  }
  carregar(true);
  setInterval(() => { if (document.visibilityState === 'visible') carregar(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregar(false); });
})();
</script>
</body>
</html>
